<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="560" viewBox="0 0 1680 560"><rect width="1680" height="560" fill="#ffffff"/><rect width="1680" height="8" fill="#0e7c86"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#16202a" text-anchor="start" font-weight="700">Vanitra — system overview</text><text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6670" text-anchor="start" font-weight="400">Two independent wearables, both fully offline. Glove: signer -&gt; listener. Wristband: listener -&gt; signer.</text><text x="60" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0e7c86" text-anchor="start" font-weight="700">GLOVE UNIT — sign to speech (ESP32-S3 #1)</text><rect x="60" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="171.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Sensors @ 50 Hz</text><text x="171.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">5 flex · 4 Hall · MPU6050</text><line x1="282" y1="182" x2="316" y2="182" stroke="#0e7c86" stroke-width="3"/><polygon points="316,174 328,182 316,190" fill="#0e7c86"/><rect x="328" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="439.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Calibrate</text><text x="439.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">flex 0..1 · Hall 0/1 · gyro bias</text><line x1="550" y1="182" x2="584" y2="182" stroke="#0e7c86" stroke-width="3"/><polygon points="584,174 596,182 584,190" fill="#0e7c86"/><rect x="596" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="707.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">0.5 s window</text><text x="707.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">16 features (shape + motion)</text><line x1="818" y1="182" x2="852" y2="182" stroke="#0e7c86" stroke-width="3"/><polygon points="852,174 864,182 852,190" fill="#0e7c86"/><rect x="864" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="975.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Neural net</text><text x="975.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">16-32-21 on chip, &lt;1 ms</text><line x1="1086" y1="182" x2="1120" y2="182" stroke="#0e7c86" stroke-width="3"/><polygon points="1120,174 1132,182 1120,190" fill="#0e7c86"/><rect x="1132" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="1243.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Gate</text><text x="1243.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">p ≥ 0.85 · 3× stable · cooldown</text><line x1="1354" y1="182" x2="1388" y2="182" stroke="#0e7c86" stroke-width="3"/><polygon points="1388,174 1400,182 1388,190" fill="#0e7c86"/><rect x="1400" y="150" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="1511.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Speak</text><text x="1511.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">WAV clip -&gt; MAX98357A + OLED</text><text x="60" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3949ab" text-anchor="start" font-weight="700">WRISTBAND UNIT — speech to touch (ESP32-S3 #2)</text><rect x="60" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="171.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">INMP441 mic</text><text x="171.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">16 kHz I2S</text><line x1="282" y1="322" x2="316" y2="322" stroke="#3949ab" stroke-width="3"/><polygon points="316,314 328,322 316,330" fill="#3949ab"/><rect x="328" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="439.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">WakeNet</text><text x="439.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">"Hi ESP" or LISTEN button</text><line x1="550" y1="322" x2="584" y2="322" stroke="#3949ab" stroke-width="3"/><polygon points="584,314 596,322 584,330" fill="#3949ab"/><rect x="596" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="707.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">MultiNet</text><text x="707.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">49 phrases -&gt; 22 meanings</text><line x1="818" y1="322" x2="852" y2="322" stroke="#3949ab" stroke-width="3"/><polygon points="852,314 864,322 852,330" fill="#3949ab"/><rect x="864" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="975.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Short code</text><text x="975.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">"are you okay" -&gt; OK?</text><line x1="1086" y1="322" x2="1120" y2="322" stroke="#3949ab" stroke-width="3"/><polygon points="1120,314 1132,322 1120,330" fill="#3949ab"/><rect x="1132" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="1243.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Morse timeline</text><text x="1243.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">dot 90/120/160 ms</text><line x1="1354" y1="322" x2="1388" y2="322" stroke="#3949ab" stroke-width="3"/><polygon points="1388,314 1400,322 1388,330" fill="#3949ab"/><rect x="1400" y="290" width="222" height="64" rx="8" fill="#f3f6f9" stroke="#16202a" stroke-width="2"/><text x="1511.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#16202a" text-anchor="middle" font-weight="700">Vibrate</text><text x="1511.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6670" text-anchor="middle" font-weight="400">ERM motor + OLED text</text><rect x="60" y="400" width="820" height="100" rx="8" fill="#e8f6f7" stroke="#0e7c86" stroke-width="2"/><text x="74" y="423" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16202a" text-anchor="start" font-weight="700">Design choices (details in docs/decisions.md)</text><text x="74" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16202a" text-anchor="start" font-weight="400">• No cloud, no phone: all recognition runs on the two ESP32-S3 chips.</text><text x="74" y="461" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16202a" text-anchor="start" font-weight="400">• Wristband recognises a fixed phrase list (ESP-SR), not open dictation — reliable offline.</text><text x="74" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#16202a" text-anchor="start" font-weight="400">• Messages are vibrated as short codes (HI, OK?, WATER?), not full sentences: 1-8 s each at normal speed.</text></svg>